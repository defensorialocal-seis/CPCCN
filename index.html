<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plazos procesales · CPCCN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#2b3441;--mut:#6b7685;--line:#e6e9e4;--acc:#6f9bd1;--mint:#e3f1ea;--mintk:#2f6b55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#f6f7f4}}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(135deg,#e8eff8,#e9f3ee);padding:22px 16px 16px;border-bottom:1px solid var(--line)}
.w{max-width:960px;margin:0 auto}
h1{margin:0;font-size:clamp(1.2rem,4vw,1.7rem);font-weight:700;letter-spacing:-.02em}
.sub{margin:2px 0 14px;color:var(--mut);font-size:.88rem}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--line)}
.bar .w{display:grid;grid-template-columns:1fr 200px 110px;gap:8px}
input,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px #6f9bd133}
main{padding:14px 16px 40px}
.meta{color:var(--mut);font-size:.85rem;margin:4px 0 8px}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 8px;font-weight:600}
.g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px;box-shadow:0 1px 2px #2b34410a}
.g h3{margin:0 0 6px;font-size:.98rem;font-weight:600}
.i{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line)}
.i:first-of-type{border-top:0}
.art{flex:none;min-width:74px;text-align:center;background:#e8eff8;color:#3d5f8c;border-radius:8px;padding:2px 8px;font-size:.82rem;font-weight:600}
.pl{flex:1;background:var(--mint);color:var(--mintk);border-radius:10px;padding:6px 10px;font-weight:500}
.fx{display:block;margin-top:4px;font-size:.75rem;color:#8a6a2f;background:#fbf1dc;border-radius:6px;padding:1px 6px;width:fit-content}
mark{background:#fde9a8;border-radius:3px;padding:0 1px}
.no{text-align:center;color:var(--mut);padding:40px 0}
footer{color:var(--mut);font-size:.78rem;text-align:center;padding:0 16px 24px}
@media(max-width:640px){.bar .w{grid-template-columns:1fr 1fr}.bar .w input:first-child{grid-column:1/-1}.i{flex-direction:column;gap:6px}.art{align-self:flex-start}}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lk{font:inherit;font-size:.82rem;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 12px;color:#3d5f8c;cursor:pointer}
.i{flex-wrap:wrap}.art{border:0;cursor:pointer;font-family:inherit;min-width:92px}.art:hover{background:#d8e5f4}.art i{font-style:normal;font-size:.7rem}
.art.ref{background:#eef1f5;color:#6b7685}.tw{flex-basis:100%}.tw[hidden]{display:none}
.tx{background:#fafaf7;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:8px 12px;margin:4px 0 2px;font-size:.9rem;line-height:1.6}
.tx b{display:block;font-size:.76rem;color:#3d5f8c;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.tx p{margin:0 0 6px}.tx p.nt{color:var(--mut);font-size:.78rem;font-style:italic}
</style></head><body>
<header><div class="w"><h1>Plazos procesales · CPCCN</h1>
<p class="sub">Código Procesal Civil y Comercial de la Nación · Ley 17.454 (t.o. 1981)</p></div></header>
<div class="bar"><div class="w">
<input id="q" type="search" placeholder="Buscar: tema, artículo o texto del plazo…" autocomplete="off">
<select id="sec"><option value="">Todas las materias</option></select>
<input id="d" type="number" min="1" placeholder="N.º días">
</div></div>
<main class="w"><div class="meta"><span id="cnt"></span><button id="ex" class="lk">Expandir todo</button></div><div id="out"></div></main>
<footer>Plazos contrastados con el PDF; cada artículo muestra su texto original. Siempre confirme en la norma vigente.</footer>
<script>
let S,D,A;
const $=s=>document.querySelector(s),q=$('#q'),sec=$('#sec'),dd=$('#d'),out=$('#out');
const nz=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const O=new Set(),TN={};let allOpen=false;
const ac=x=>x.replace(/[aeiou]/g,c=>'['+c+{a:'á',e:'é',i:'í',o:'ó',u:'ú'}[c]+']');
const tn=k=>TN[k]||(TN[k]=nz((A[k]||[]).join(' ')));
const ks=l=>l.match(/\d+(?: (?:bis|ter|quater))?/g)||[];
function render(){
 const t=nz(q.value).split(/\s+/).filter(Boolean),n=dd.value.trim(),sv=sec.value;
 const nr=n&&new RegExp('\\('+n+'\\)|\\b'+n+'\\s*(dias|horas)');
 const hl=t.length?new RegExp('('+t.map(x=>/^\d+$/.test(x)?'(?<!\\d)'+x+'(?!\\d)':ac(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'))).join('|')+')','gi'):0;
 const has=(txt,w)=>/^\d+$/.test(w)?new RegExp('(?<!\\d)'+w+'(?!\\d)').test(txt):txt.includes(w);
 const H=s=>hl?esc(s).replace(hl,'<mark>$1</mark>'):esc(s);
 let h='',tot=0,last=-1;const F={};
 D.forEach((g,gi)=>{
  if(sv!==''&&+sv!==g[0])return;
  const rows=[];
  g[2].forEach((x,j)=>{
   const k1=nz(S[g[0]]+' '+g[1]+' Art. '+x[0]+' '+x[1]),kk=ks(x[0]);
   if(!t.every(w=>has(k1,w))||(nr&&!nr.test(nz(x[1]))))return;
   const id=gi+'.'+j,op=allOpen||O.has(id);
   const nw=kk.filter(k=>!(k in F));nw.forEach(k=>F[k]=id);
   const tx=nw.map(k=>'<div class="tx"><b>Art. '+k+' · texto original</b>'+(A[k]||['(Texto no disponible)']).map(p=>'<p'+(/^\(.*\)$/.test(p)?' class="nt"':'')+'>'+H(p)+'</p>').join('')+'</div>').join('');
   const pl='<div class="pl">'+H(x[1])+(x[2]?'<span class="fx">Corregido según PDF: figuraba como Art. 109</span>':'')+'</div>';
   if(kk.length&&!tx)rows.push('<div class="i"><button class="art ref" data-ref="'+F[kk[0]]+'" title="El texto de este artículo ya se muestra arriba">Art. '+H(x[0])+' <i>↑</i></button>'+pl+'</div>');
   else rows.push('<div class="i"><button class="art" data-id="'+id+'" aria-expanded="'+op+'">Art. '+H(x[0])+' <i>'+(op?'▴':'▾')+'</i></button>'+pl+'<div class="tw"'+(op?'':' hidden')+'>'+tx+'</div></div>');
  });
  if(!rows.length)return;
  if(g[0]!==last){h+='<h2>'+esc(S[g[0]])+'</h2>';last=g[0]}
  tot+=rows.length;
  h+='<section class="g"><h3>'+H(g[1])+'</h3>'+rows.join('')+'</section>';
 });
 out.innerHTML=h||'<div class="no">Sin resultados. Pruebe con otras palabras.</div>';
 $('#cnt').textContent=tot+' plazo'+(tot===1?'':'s')+' encontrado'+(tot===1?'':'s');
 history.replaceState(null,'','#'+new URLSearchParams({q:q.value,s:sv,d:n}));
}
out.addEventListener('click',e=>{const b=e.target.closest('.art');if(!b)return;
 if(b.dataset.ref){const t=out.querySelector('.art[data-id="'+b.dataset.ref+'"]');if(t){if(t.getAttribute('aria-expanded')!=='true')t.click();t.scrollIntoView({block:'center',behavior:'smooth'})}return}
 const w=b.parentNode.querySelector('.tw'),o=w.hidden;w.hidden=!o;b.setAttribute('aria-expanded',o);b.lastElementChild.textContent=o?'▴':'▾';o?O.add(b.dataset.id):O.delete(b.dataset.id)});
$('#ex').addEventListener('click',e=>{allOpen=!allOpen;O.clear();e.target.textContent=allOpen?'Contraer todo':'Expandir todo';render()});
function init(){S.forEach((s,i)=>sec.add(new Option(s,i)));
 const P=new URLSearchParams(location.hash.slice(1));
 q.value=P.get('q')||'';sec.value=P.get('s')||'';dd.value=P.get('d')||'';render()}
[q,sec,dd].forEach(e=>e.addEventListener('input',render));
